# SonarQube Project Configuration
sonar.projectKey=todolist-layered-ts-main
sonar.projectName=ToDoList Layered TypeScript (Main)
sonar.projectVersion=0.1.0

# Source code location
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Language settings
sonar.language=ts
sonar.typescript.node=node

# Exclusions
sonar.exclusions=node_modules/**,dist/**,data/**,**/*.spec.ts,**/*.test.ts

# Test settings
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Coverage (if you generate reports)
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# SonarQube server settings
sonar.host.url=http://localhost:9000
