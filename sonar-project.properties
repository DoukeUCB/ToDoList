# SonarQube Project Configuration
sonar.projectVersion=0.1.0

# Source code location
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Language settings
sonar.language=ts
sonar.typescript.node=node

# Exclusions
sonar.exclusions=node_modules/**,dist/**,data/**,**/*.spec.ts,**/*.test.ts

# Test settings
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Código fuente
sonar.sources=src

# Carpeta de tests
sonar.tests=tests
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Reporte de cobertura (Jest o Vitest debe generarlo)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# SonarQube server settings
sonar.host.url=http://localhost:9000