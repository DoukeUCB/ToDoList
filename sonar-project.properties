# SonarQube Project Configuration
sonar.projectKey=todolist-layered-ts
sonar.projectName=ToDoList Layered TypeScript
sonar.projectVersion=0.1.0

# Source code location
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Language settings
sonar.language=ts
sonar.typescript.node=node

# Exclusions
sonar.exclusions=node_modules/**,dist/**,data/**,**/*.spec.ts,**/*.test.ts

# Test settings (if you have tests)
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# Coverage settings (if you generate coverage reports)
# sonar.typescript.lcov.reportPaths=coverage/lcov.info

# SonarQube server settings (using default localhost)
sonar.host.url=http://localhost:9000
